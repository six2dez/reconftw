# Phase 3 Foundation Kernel CI pipeline — Go v2 kernel gates.
# Source: ADR 0002 §9.3 lines 2270-2326 (canonical seed).
#
# This workflow is ADDITIVE to the existing bats v1 workflows
# (tests.yml, semgrep.yml, docker_nightly.yml) — those remain untouched
# until Phase 12 cutover per CONTEXT.md.
#
# Jobs (single-platform ubuntu-latest per CONTEXT.md Claude-discretion
# default (a); XPLAT-05 cross-platform matrix is Phase 11):
#   - lint        — gofumpt format-check + golangci-lint (errcheck/govet/
#                   staticcheck/unused/gofumpt enabled)
#   - unit        — go test -race -short ./...  + XCUT-07 sentinel
#                   explicit gate step
#   - integration — go test -race ./... + XCUT-04 ≥75% coverage gate on
#                   internal/core/...
#   - smoke       — go test -race -tags smoke ./...  (PR + scheduled
#                   only); MANDATORY per plan 03-01 W12 revision iter 1
#                   for FOUND-04 SIGKILL atomicity + FOUND-09 kill-tree
#                   tests that the unit ring cannot deliver
#   - binary-size — XCUT-02 build with -ldflags="-s -w" -trimpath; size
#                   gate <50MB (52428800 bytes). Skipped via hashFiles()
#                   until Plan 03-05 lands cmd/reconftw/main.go.

name: ci

on:
  push:
    branches: ["**"]
  pull_request: {}
  schedule:
    # Run smoke job weekly on Sundays at 03:17 UTC.
    - cron: "17 3 * * 0"

permissions:
  contents: read  # least privilege (supply-chain hygiene)

jobs:
  lint:
    name: Lint + format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.7.0
      - name: gofumpt format-check
        run: |
          DIFF=$(gofumpt -d .)
          if [ -n "$DIFF" ]; then
            echo "::error::gofumpt found formatting issues:"
            echo "$DIFF"
            exit 1
          fi
      - name: Install golangci-lint v2.12.2
        run: |
          # Pin the installer to the SAME tag as the binary. Fetching install.sh from
          # master while asking for an older release makes the checksum verification
          # fail ("did not verify"), which took this step down and skipped lint entirely.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | \
            sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    # Reachability-based scan of the stdlib and every dependency. This gate was
    # absent while go.mod pinned 1.25.0, whose stdlib carried reachable
    # TLS/x509, html/template, net/http2 and mail advisories — a security tool
    # shipping a known-vulnerable runtime. go.mod now floors at a patched
    # release and this job keeps it that way.
    #
    # govulncheck reports only vulnerabilities that are actually REACHABLE from
    # this code, so a finding here is real exposure, not advisory noise.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        # Pinned, not @latest: an unpinned scanner makes the gate's verdict
        # depend on when it ran, so a green build is not reproducible and a new
        # release can turn CI red with no change to this repo.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        run: govulncheck ./...

  unit:
    name: Unit + Property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -short ./...
        run: go test -race -short ./...
      - name: XCUT-07 sentinel gate (logging hygiene)
        # Runs explicitly to make the gate visible in CI logs as a named
        # step — even though the test is already in the previous step,
        # surfacing it as its own job step prevents accidental rename or
        # deletion regressions.
        run: |
          go test -race -run 'TestXCUT07Sentinel|TestSentinel' \
            ./internal/core/log/...

  integration:
    name: Integration tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race ./...
        run: go test -race ./...
      - name: XCUT-04 coverage gate (≥75% on internal/core/...)
        # XCUT-04 lib-code coverage gate. Phase 3 plan-01 ships only
        # internal/core/errors/ and internal/core/log/ — both at 90%+
        # — so the gate passes trivially. Later plans extend the
        # measured packages while keeping the gate at ≥75%.
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./internal/core/...
          go tool cover -func=coverage.out | tail -1 | awk '{
            pct=substr($3,1,length($3)-1)+0
            if (pct < 75.0) {
              print "Coverage below 75% gate:", $3
              exit 1
            } else {
              print "Coverage:", $3
            }
          }'
      - name: Critical-path coverage gate self-test (proves the gate can fail)
        # Runs BEFORE the gate. scripts/coverage-critical.sh was incapable of
        # failing for its entire life — it averaged per-function percentages
        # without weighting them by statement count, and scored a file with no
        # entries in the profile a perfect 100. Nothing noticed, because nothing
        # ever fed it an input it was supposed to reject.
        #
        # This step feeds it exactly those inputs and asserts a non-zero exit, so
        # a future edit that re-breaks the gate's ability to fail is caught in
        # the same job rather than discovered by an audit. Synthetic profiles
        # only; it runs no tests and takes about a second.
        run: make coverage-critical-selftest
      - name: Critical-path coverage gate (XCUT-03 per W20)
        # XCUT-03 per-file ≥90% statement-weighted gate on the kernel critical
        # paths. scripts/coverage-critical.sh is the SINGLE SOURCE OF TRUTH: it
        # owns the file list, the package list and the threshold. This step owns
        # nothing but the invocation.
        #
        # It used to carry a byte-identical copy of the script's awk one-liner
        # plus its own hardcoded list of critical files, and the two had already
        # drifted — CI enforced 5 files while the script enforced 13, so
        # log/secret.go, three checkpoint/*.go files and the whole scheduler
        # package were gated locally and not here. Two lists that must be kept
        # in sync will drift; deleting one is the only fix that holds.
        #
        # REFRESH_COVERAGE=1 is explicit rather than implied by the default: the
        # script MUST build its own profile from CRITICAL_PKGS and must never
        # inherit the ./internal/core/... profile the XCUT-04 step above wrote,
        # which covers a different package set (and includes resolvers).
        env:
          REFRESH_COVERAGE: "1"
        run: make coverage-critical

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -tags smoke ./...
        # Smoke ring per ADR §9 — build-tagged tests that gate atomicity
        # proofs the unit ring cannot deliver (FOUND-04 subprocess SIGKILL
        # atomicity in Plan 03; FOUND-09 kill-tree in Plan 04). Plan 03-01
        # ships no smoke tests yet — the suite is empty so this job is a
        # placeholder that succeeds. Adding `-tags smoke` files lands in
        # Plans 03-03/04 per W12 revision iter 1.
        run: go test -race -tags smoke ./...

  binary-size:
    name: Binary size budget (XCUT-02)
    runs-on: ubuntu-latest
    # Plan 03-06 landed cmd/reconftw/main.go; Plan 03-07 activates the gate
    # unconditionally. XCUT-02 budget: <50MB stripped (52428800 bytes).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build with XCUT-02 strip/trimpath
        run: go build -ldflags="-s -w" -trimpath -o bin/reconftw ./cmd/reconftw
      - name: Assert binary <50MB (52428800 bytes)
        run: |
          SIZE=$(stat --printf=%s bin/reconftw 2>/dev/null || stat -f%z bin/reconftw)
          echo "binary size: $SIZE bytes"
          if [ "$SIZE" -ge 52428800 ]; then
            echo "::error::binary >=50MB (XCUT-02 gate)"
            exit 1
          fi

  integration-smoke:
    name: Integration smoke (E2E)
    runs-on: ubuntu-latest
    # Hermetic end-to-end gate: drives production record types through the real
    # staging write, merge and scope gate, and asserts artefact CONTENT — not
    # just exit codes. No external tools, no network.
    #
    # This job previously ran `-run TestKernelDemoEndToEnd`, a test deleted in
    # Phase 4. `go test -run` exits 0 when its pattern matches nothing, so the
    # job reported green for months while executing zero tests. The match-count
    # guard below is the actual fix: a gate that cannot fail is worse than no
    # gate, because it manufactures confidence.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: E2E gate
        run: |
          set -euo pipefail
          PATTERN='^TestE2E'
          MATCHED=$(go test -list "$PATTERN" ./... 2>/dev/null | grep -c '^TestE2E' || true)
          echo "E2E tests selected by ${PATTERN}: ${MATCHED}"
          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::E2E gate selected ZERO tests. A -run pattern matching nothing exits 0 and produces a false green — failing loudly instead."
            exit 1
          fi
          go test -race -run "$PATTERN" ./...
      - name: interfaces_check (BINDING delta detector)
        # Plan 03-07 upgraded cmd/interfaces_check/main.go to import real
        # packages + compile-time assertions. ADR §5 signature drift now
        # fails this build step.
        run: go build ./cmd/interfaces_check/...
      # REMOVED: verify-0002.sh (ADR pre-sign gate).
      #
      # It ran `bash .planning/decisions/verify-0002.sh`, which reads
      # .planning/decisions/0002-architecture-v2.md. `.planning/` is no longer
      # published — a public repo was shipping the full planning tree, including
      # target names in that very ADR — so a CI checkout does not contain either
      # file and this step could only fail.
      #
      # What it checked, and where that lives now: Check 3 (the ADR's Go
      # interface snippets compile) is the `interfaces_check` step directly
      # above, which builds the real compile-time assertions rather than
      # snippets. Checks 1, 2 and 4 (ARCH-NN coverage, TOML block validity,
      # glossary completeness) are internal consistency of a document that only
      # ships to whoever edits it, so they belong where that document does. The
      # script still runs locally:
      #
      #     bash .planning/decisions/verify-0002.sh
      #
      # Re-adding it to CI means publishing the ADR again — decide that first.

  release-gates:
    name: Release gates (phase 15 acceptance)
    runs-on: ubuntu-latest
    # Phase 15's twelve acceptance gates plus the regression guard, in ONE
    # command. This is the evidence the Phase 14 cutover is signed off against.
    #
    # Deliberately its OWN job rather than a step in `unit` or `integration`:
    # this repo already splits a fast per-push loop from heavier work, and
    # release-gates re-runs `go test -race ./...`, govulncheck and the coverage
    # gates. Folding it into the per-push job would roughly double every push's
    # wall time for a check whose audience is the cutover decision.
    #
    # ACCEPTANCE GATE 11 IS NOT RUN HERE. Its owner is
    # .github/workflows/docker_nightly.yml, job `docker`, step
    # `Verify image health (linux/arm64)`, which builds the multiarch image and
    # runs it under QEMU. `make release-gates` reports it SKIPPED with that
    # reason rather than pretending to cover it — so the two workflows do not
    # duplicate a ~20-minute buildx run, and neither one silently claims the
    # other's result.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.7.0
      - name: Install govulncheck
        # Pinned to the same version as the govulncheck job above: an unpinned
        # scanner makes a green build depend on when it ran.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Install nuclei (pinned)
        # The version is the pin already recorded on the `nuclei=` line of
        # tools.lock -- one pin, two consumers. An unpinned scanner is forbidden
        # here for the same reason the govulncheck comment above gives: a green
        # build must not depend on when it ran. The comparison below is what
        # enforces that, rather than a comment asserting the two agree -- bump
        # tools.lock without touching this file and this step goes red.
        shell: bash
        run: |
          set -euo pipefail
          want="github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.8.0"
          lock="$(grep '^nuclei=' tools.lock | head -1 | cut -d '=' -f 2-)"
          if [ "$want" != "$lock" ]; then
            echo "::error::nuclei pin drift -- this workflow installs '$want' but tools.lock records '$lock'. One pin, two consumers: change both or neither."
            exit 1
          fi
          go install "$want"
          gobin="$(go env GOPATH)/bin"
          # The engine prints its version on stderr. Assert it, so a binary that
          # is not the pinned one cannot reach the gates step unnoticed.
          ver="$("$gobin/nuclei" -duc -version 2>&1 || true)"
          case "$ver" in
            *"${want##*@}"*) echo "installed nuclei reports ${want##*@}" ;;
            *) echo "::error::installed nuclei does not report ${want##*@}: $ver" ; exit 1 ;;
          esac
          echo "$gobin" >> "$GITHUB_PATH"
      - name: Install nuclei templates
        # internal/modules/web/nuclei_coverage_test.go builds these two paths
        # from os.UserHomeDir() and they are not configurable, so
        # -update-template-dir pins the tree exactly where the tests read it.
        #
        # -duc is deliberately NOT passed to the updater. It suppresses
        # -update-templates outright: against the pinned binary,
        # `nuclei -duc -update-templates` exits 0 having downloaded nothing.
        # That is the false green this step must not produce, so the
        # update-check guard stays where it belongs -- on the scan the tests
        # run, via nuclei's registration in nuclei_coverage_test.go.
        #
        # The existence assertion is the load-bearing half. The updater's
        # default layout is a version-dependent detail and the test helpers
        # hardcode these paths, so a tree that lands anywhere else must redden
        # this step rather than let both tests skip -- a skipped test is not a
        # passing test, and gate 14a counts it as a failure.
        shell: bash
        run: |
          set -euo pipefail
          tpl="$HOME/nuclei-templates"
          oidc="$HOME/nuclei-templates/http/technologies/oidc-detect.yaml"
          keycloak="$HOME/nuclei-templates/http/exposures/configs/keycloak-openid-config.yaml"
          if ! nuclei -update-templates -update-template-dir "$tpl"; then
            echo "::warning::the nuclei template updater exited non-zero -- the assertion below is what decides this step"
          fi
          if [ ! -f "$oidc" ] || [ ! -f "$keycloak" ]; then
            echo "::warning::the updater did not leave both OIDC templates under $tpl -- falling back to a shallow clone of the template tree"
            rm -rf "$tpl"
            git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates "$tpl"
          fi
          rc=0
          for f in "$oidc" "$keycloak"; do
            if [ -f "$f" ]; then
              echo "ok $f"
            else
              echo "::error::template not installed at $f -- the two nuclei coverage tests read this exact path and would skip"
              rc=1
            fi
          done
          exit "$rc"
      - name: make release-gates
        id: gates
        run: make release-gates

      # ── gate 13 evidence ──────────────────────────────────────────────────
      # scripts/release-gates.sh writes every gate's log into a `mktemp -d`
      # directory (line 532) and `cleanup_logdir` RETAINS it only when a gate
      # recorded a FAIL. That directory never reaches the job log, so gate 13's
      # verdict has so far been arbitrated by reading the script rather than by
      # reading the log the script wrote. These two steps carry
      # `gate13_argvector.log` -- and nothing else out of LOGDIR, which holds
      # unrelated tool output and would become public on this public repo --
      # into a downloadable artifact.
      #
      # The three conditions are chosen together. `failure()` scopes both steps
      # to the only case where the log directory can still exist: on a full pass
      # cleanup_logdir deletes it, and an unconditional `if-no-files-found:
      # error` would then fail the job on the very success this is driving
      # toward. The `steps.collect.outputs.found` guard closes the inverse hole:
      # without it a job that dies before any gate runs -- checkout, setup-go or
      # an install step -- reddens the upload step for having nothing to upload,
      # and the job's most visible failure becomes the artifact step instead of
      # the step that actually broke. With both in place `if-no-files-found:
      # error` keeps all of its teeth for the case it was written for: the
      # collect step said it staged a log and the upload then finds none.
      - name: Collect gate 13 evidence
        id: collect
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          tmproot="${TMPDIR:-/tmp}"
          dest="${{ runner.temp }}/release-gates-logs"
          mkdir -p "$dest"
          dirs=("$tmproot"/reconftw-release-gates.*)
          staged=0
          for d in "${dirs[@]}"; do
            [ -d "$d" ] || continue
            # ONLY this filename. The rest of LOGDIR is other gates' tool output
            # and is not staged for a public artifact.
            log="$d/gate13_argvector.log"
            [ -f "$log" ] || continue
            cp "$log" "$dest/$(basename "$d")-gate13_argvector.log"
            staged=$((staged + 1))
          done
          if [ "$staged" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "staged $staged gate13_argvector.log file(s):"
            ls -l "$dest"
            exit 0
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No $tmproot/reconftw-release-gates.* directory exists."
            echo "release-gates.sh retains its log directory only when a gate recorded"
            echo "a FAIL, so this job failed BEFORE any gate ran. The step that actually"
            echo "broke is above this one."
          else
            echo "A retained log directory exists but carries no gate13_argvector.log,"
            echo "so gate 13 did not run. The step that actually broke is above this one."
          fi
          echo "This step is a reporter, not a gate: it exits 0 on purpose so that a"
          echo "pre-gate failure leaves exactly one red step, the one that broke."
          exit 0
      - name: Upload gate 13 evidence
        if: failure() && steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-gate13
          path: ${{ runner.temp }}/release-gates-logs/
          if-no-files-found: error
          retention-days: 14

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    # XPLAT-05: build + smoke-test the binary on every supported platform on
    # each PR/push (Linux + macOS; Apple Silicon via macos-latest, Intel x86_64
    # via macos-15-intel — macos-13 was retired 2025-12-04 and jobs targeting a
    # retired label queue forever. macos-15-intel is supported until Aug 2027).
    # The weekly integration-full run lives in the scheduled jobs above.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -ldflags="-s -w" -trimpath -o bin/reconftw ./cmd/reconftw
      - name: Smoke test
        run: go test -race -tags smoke ./...
      - name: Binary size gate (XCUT-02)
        shell: bash
        run: |
          SIZE=$(stat --printf=%s bin/reconftw 2>/dev/null || stat -f%z bin/reconftw)
          echo "binary size: $SIZE bytes"
          if [ "$SIZE" -ge 52428800 ]; then
            echo "::error::binary >=50MB (XCUT-02 gate)"
            exit 1
          fi
