# Phase 3 Foundation Kernel CI pipeline — Go v2 kernel gates.
# Source: ADR 0002 §9.3 lines 2270-2326 (canonical seed).
#
# This workflow is ADDITIVE to the existing bats v1 workflows
# (tests.yml, semgrep.yml, docker_nightly.yml) — those remain untouched
# until Phase 12 cutover per CONTEXT.md.
#
# `make ci` is the local mirror of this file: same gates, same order. Add a
# step to one and add it to the other.
#
# HONESTY RULES THIS FILE FOLLOWS (task 21-03):
#   * Every `-run` pattern is preceded by a `go test -list` count guard that
#     fails on ZERO matches. `go test -run` exits 0 when its pattern matches
#     nothing, which is how a deleted test kept a gate green for months.
#   * Every job has `timeout-minutes`. A job with no timeout that hangs on a
#     blocked UDP/53 socket occupies a runner for six hours and reports nothing.
#   * release-gates runs with --require-all: a gate is PASS, FAIL, or DELEGATED
#     with a pointer to where it IS enforced. A SKIPPED gate fails the job.
#   * The release-gates summary and gate 13's log are uploaded on EVERY
#     outcome (`if: always()`), from a caller-owned directory the script never
#     deletes.
#
# Jobs (single-platform ubuntu-latest per CONTEXT.md Claude-discretion
# default (a); XPLAT-05 cross-platform matrix is Phase 11):
#   - lint        — gofumpt format-check + golangci-lint (errcheck/govet/
#                   staticcheck/unused/gofumpt enabled)
#   - govulncheck — reachability scan, pinned
#   - unit        — go test -race -short ./...  + XCUT-07 sentinel gate
#                   (make sentinel-gate, zero-match guarded)
#   - integration — go test -race ./... + XCUT-04 ≥75% coverage gate on
#                   internal/core/... + coverage-critical (self-tested) +
#                   coverage-lib + coverage-floor (ratchet)
#   - smoke       — go test -race -tags smoke ./...  (PR + scheduled only;
#                   scheduled runs cover main AND dev-go)
#   - binary-size — XCUT-02 build with -ldflags="-s -w" -trimpath; <50MB
#   - integration-smoke — hermetic E2E gate + interfaces_check
#   - release-gates — phase 15 acceptance gates, --require-all
#   - platform-smoke — build + the smoke-tagged ring ONLY, per platform
#
# SCHEDULE AND BRANCHES. GitHub evaluates `schedule` on the default branch
# only, so a weekly cron on a repo whose active line is dev-go would never
# exercise dev-go. The two schedule-bearing jobs (smoke, release-gates) carry a
# `ref` matrix that, on a scheduled run only, checks out main AND dev-go
# explicitly; on every other event the matrix collapses to the triggering ref.
# Per-push jobs already cover dev-go through `push: branches: ["**"]`. The ref
# list is written out in BOTH jobs' matrices, because `strategy.matrix` cannot
# read the `env` context: when dev-go is deleted after the cutover, drop it
# from both (a checkout of a missing ref fails, loudly, which is the right
# failure mode).

name: ci

on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    # Weekly on Sundays at 03:17 UTC. Runs from the default branch; the smoke
    # and release-gates jobs fan out to main + dev-go via their ref matrix.
    - cron: "17 3 * * 0"

permissions:
  contents: read  # least privilege (supply-chain hygiene)

jobs:
  lint:
    name: Lint + format-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.7.0
      - name: gofumpt format-check
        run: |
          DIFF=$(gofumpt -d .)
          if [ -n "$DIFF" ]; then
            echo "::error::gofumpt found formatting issues:"
            echo "$DIFF"
            exit 1
          fi
      - name: Install golangci-lint v2.12.2
        run: |
          # Pin the installer to the SAME tag as the binary. Fetching install.sh from
          # master while asking for an older release makes the checksum verification
          # fail ("did not verify"), which took this step down and skipped lint entirely.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | \
            sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reachability-based scan of the stdlib and every dependency. This gate was
    # absent while go.mod pinned 1.25.0, whose stdlib carried reachable
    # TLS/x509, html/template, net/http2 and mail advisories — a security tool
    # shipping a known-vulnerable runtime. go.mod now floors at a patched
    # release and this job keeps it that way.
    #
    # govulncheck reports only vulnerabilities that are actually REACHABLE from
    # this code, so a finding here is real exposure, not advisory noise.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        # Pinned, not @latest: an unpinned scanner makes the gate's verdict
        # depend on when it ran, so a green build is not reproducible and a new
        # release can turn CI red with no change to this repo.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        run: govulncheck ./...

  unit:
    name: Unit + Property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -short ./...
        run: go test -race -short ./...
      - name: XCUT-07 sentinel gate (logging hygiene)
        # Runs explicitly to make the gate visible in CI logs as a named
        # step — even though the test is already in the previous step,
        # surfacing it as its own job step prevents accidental rename or
        # deletion regressions.
        #
        # This step used to run `-run 'TestXCUT07Sentinel|TestSentinel'`.
        # `TestSentinel` has never existed in internal/core/log, and `go test
        # -run` exits 0 on a pattern that matches nothing, so renaming
        # TestXCUT07Sentinel would have left this step green while it ran no
        # test at all. `make sentinel-gate` lists the pattern first and fails
        # on zero matches — the same guard integration-smoke uses.
        run: make sentinel-gate

  integration:
    name: Integration tests + coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race ./...
        run: go test -race ./...
      - name: XCUT-04 coverage gate (≥75% on internal/core/...)
        # XCUT-04 lib-code coverage gate on the FULL internal/core tree,
        # resolvers included — this runner has outbound UDP/53, so the number
        # that cannot be measured offline is measured here. `make coverage-core`
        # is the same assertion for a networked local box.
        run: make coverage-core
      - name: Critical-path coverage gate self-test (proves the gate can fail)
        # Runs BEFORE the gate. scripts/coverage-critical.sh was incapable of
        # failing for its entire life — it averaged per-function percentages
        # without weighting them by statement count, and scored a file with no
        # entries in the profile a perfect 100. Nothing noticed, because nothing
        # ever fed it an input it was supposed to reject.
        #
        # This step feeds it exactly those inputs and asserts a non-zero exit, so
        # a future edit that re-breaks the gate's ability to fail is caught in
        # the same job rather than discovered by an audit. Synthetic profiles
        # only; it runs no tests and takes about a second.
        run: make coverage-critical-selftest
      - name: Critical-path coverage gate (XCUT-03 per W20)
        # XCUT-03 per-file ≥90% statement-weighted gate on the kernel critical
        # paths. scripts/coverage-critical.sh is the SINGLE SOURCE OF TRUTH: it
        # owns the file list, the package list and the threshold. This step owns
        # nothing but the invocation.
        #
        # It used to carry a byte-identical copy of the script's awk one-liner
        # plus its own hardcoded list of critical files, and the two had already
        # drifted — CI enforced 5 files while the script enforced 13, so
        # log/secret.go, three checkpoint/*.go files and the whole scheduler
        # package were gated locally and not here. Two lists that must be kept
        # in sync will drift; deleting one is the only fix that holds.
        #
        # REFRESH_COVERAGE=1 is explicit rather than implied by the default: the
        # script MUST build its own profile from CRITICAL_PKGS and must never
        # inherit the ./internal/core/... profile the XCUT-04 step above wrote,
        # which covers a different package set (and includes resolvers).
        env:
          REFRESH_COVERAGE: "1"
        run: make coverage-critical
      - name: Lib-aggregate coverage gate (XCUT-03, resolvers-excluded)
        # scripts/coverage-lib.sh — ≥75% over internal/core/... minus
        # resolvers. It was a `make ci` step for a year without ever running
        # here; it takes ~11s offline, so there was no reason for CI to be the
        # one place it did not run.
        run: make coverage-lib
      - name: Coverage floor ratchet (internal/modules, internal/store)
        # scripts/coverage-floor.sh with scripts/coverage-floor.ratchet. The
        # two trees NO other coverage gate looks at: every tool wrapper and
        # parser, and the sqlc store the report/monitor/SARIF paths read.
        # Floors are measured-minus-two and may only be raised; see the ratchet
        # file for the derivation. Skips TestGenResolversCallsDnsvalidator by
        # name, which otherwise runs the real dnsvalidator to the timeout on a
        # box that has it.
        run: make coverage-floor

  smoke:
    name: Smoke tests (${{ matrix.ref || 'this ref' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # On a scheduled run: main AND dev-go. Otherwise a single empty ref,
        # which actions/checkout reads as "the triggering ref". See the
        # SCHEDULE AND BRANCHES note at the top of this file.
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main", "dev-go"]') || fromJSON('[""]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Smoke ring (make test-smoke, count-guarded)
        # Smoke ring per ADR §9 — build-tagged tests that gate atomicity
        # proofs the unit ring cannot deliver (FOUND-04 subprocess SIGKILL
        # atomicity; FOUND-09 kill-tree). `make test-smoke` computes the
        # smoke-only set (tagged minus untagged names) and fails on zero: the
        # ring was an empty placeholder once, and an empty ring must be a red
        # step, not a green one.
        run: make test-smoke

  binary-size:
    name: Binary size budget (XCUT-02)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Plan 03-06 landed cmd/reconftw/main.go; Plan 03-07 activates the gate
    # unconditionally. XCUT-02 budget: <50MB stripped (52428800 bytes).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build with XCUT-02 strip/trimpath + assert <50MB
        # `make binary-size` is the one copy of the assertion; platform-smoke
        # below runs the same target per OS.
        run: make binary-size

  integration-smoke:
    name: Integration smoke (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Hermetic end-to-end gate: drives production record types through the real
    # staging write, merge and scope gate, and asserts artefact CONTENT — not
    # just exit codes. No external tools, no network.
    #
    # This job previously ran `-run TestKernelDemoEndToEnd`, a test deleted in
    # Phase 4. `go test -run` exits 0 when its pattern matches nothing, so the
    # job reported green for months while executing zero tests. The match-count
    # guard inside `make integration-smoke` is the actual fix: a gate that
    # cannot fail is worse than no gate, because it manufactures confidence.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: E2E gate
        run: make integration-smoke
      - name: interfaces_check (BINDING delta detector)
        # Plan 03-07 upgraded cmd/interfaces_check/main.go to import real
        # packages + compile-time assertions. ADR §5 signature drift now
        # fails this build step.
        run: make interfaces-check
      # REMOVED: verify-0002.sh (ADR pre-sign gate).
      #
      # It ran `bash .planning/decisions/verify-0002.sh`, which reads
      # .planning/decisions/0002-architecture-v2.md. `.planning/` is no longer
      # published — a public repo was shipping the full planning tree, including
      # target names in that very ADR — so a CI checkout does not contain either
      # file and this step could only fail.
      #
      # What it checked, and where that lives now: Check 3 (the ADR's Go
      # interface snippets compile) is the `interfaces_check` step directly
      # above, which builds the real compile-time assertions rather than
      # snippets. Checks 1, 2 and 4 (ARCH-NN coverage, TOML block validity,
      # glossary completeness) are internal consistency of a document that only
      # ships to whoever edits it, so they belong where that document does. The
      # script still runs locally:
      #
      #     bash .planning/decisions/verify-0002.sh
      #
      # Re-adding it to CI means publishing the ADR again — decide that first.

  release-gates:
    name: Release gates (${{ matrix.ref || 'this ref' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Same scheduled fan-out as the smoke job; see the top of this file.
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main", "dev-go"]') || fromJSON('[""]') }}
    # Phase 15's twelve acceptance gates plus the regression guard, in ONE
    # command. This is the evidence the Phase 14 cutover is signed off against.
    #
    # Deliberately its OWN job rather than a step in `unit` or `integration`:
    # this repo already splits a fast per-push loop from heavier work, and
    # release-gates re-runs `go test -race ./...`, govulncheck and the coverage
    # gates. Folding it into the per-push job would roughly double every push's
    # wall time for a check whose audience is the cutover decision.
    #
    # ── WHICH GATES THIS JOB CAN AND CANNOT RUN, decided here, once ───────────
    #
    # The job runs with --require-all, so every gate row is PASS, FAIL or
    # DELEGATED; a SKIPPED gate makes the job red. Three gates cannot execute on
    # a hosted runner and are DELEGATED with a pointer, by construction:
    #
    #   Gate 11 (docker run --platform linux/arm64 … version)
    #       Needs buildx + QEMU + a registry push and ~20 minutes; `--with-docker`
    #       here would duplicate a networked build this job has no business
    #       doing. OWNER: .github/workflows/docker_nightly.yml, job `docker`,
    #       step `Verify image health (linux/arm64)`. Run it on dev-go via that
    #       workflow's workflow_dispatch.
    #   Gate 13 (real-tool arg vectors, REFERENCE mode)
    #       Needs the provisioned 70-tool tree. The hermetic half still runs
    #       here (make realtools-args is executed; a NOT_EXECUTED census is what
    #       turns into DELEGATED, a real FAIL stays FAIL). OWNER: the operator,
    #       `make release-gates-provisioned` on a provisioned box.
    #   Gate 14b (a real run's nuclei coverage above the derived floor)
    #       Needs RECONFTW_WORKSPACE from a real scan. OWNER: the operator,
    #       `RECONFTW_WORKSPACE=<ws> make release-gates-provisioned`.
    #
    # Everything else — gates 1-10, 12, 14a, the regression guard and both
    # CI-break classes — executes here and is PASS or FAIL. Nothing is SKIPPED
    # in a green run of this job; scripts/release_gates_test.sh (the step before
    # the gates) proves the flag combination can fail.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.7.0
      - name: Install govulncheck
        # Pinned to the same version as the govulncheck job above: an unpinned
        # scanner makes a green build depend on when it ran.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Install nuclei (pinned)
        # The version is the pin already recorded on the `nuclei=` line of
        # tools.lock -- one pin, two consumers. An unpinned scanner is forbidden
        # here for the same reason the govulncheck comment above gives: a green
        # build must not depend on when it ran. The comparison below is what
        # enforces that, rather than a comment asserting the two agree -- bump
        # tools.lock without touching this file and this step goes red.
        shell: bash
        run: |
          set -euo pipefail
          want="github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.8.0"
          lock="$(grep '^nuclei=' tools.lock | head -1 | cut -d '=' -f 2-)"
          if [ "$want" != "$lock" ]; then
            echo "::error::nuclei pin drift -- this workflow installs '$want' but tools.lock records '$lock'. One pin, two consumers: change both or neither."
            exit 1
          fi
          go install "$want"
          gobin="$(go env GOPATH)/bin"
          # The engine prints its version on stderr. Assert it, so a binary that
          # is not the pinned one cannot reach the gates step unnoticed.
          ver="$("$gobin/nuclei" -duc -version 2>&1 || true)"
          case "$ver" in
            *"${want##*@}"*) echo "installed nuclei reports ${want##*@}" ;;
            *) echo "::error::installed nuclei does not report ${want##*@}: $ver" ; exit 1 ;;
          esac
          echo "$gobin" >> "$GITHUB_PATH"
      - name: Install nuclei templates
        # internal/modules/web/nuclei_coverage_test.go builds these two paths
        # from os.UserHomeDir() and they are not configurable, so
        # -update-template-dir pins the tree exactly where the tests read it.
        #
        # -duc is deliberately NOT passed to the updater. It suppresses
        # -update-templates outright: against the pinned binary,
        # `nuclei -duc -update-templates` exits 0 having downloaded nothing.
        # That is the false green this step must not produce, so the
        # update-check guard stays where it belongs -- on the scan the tests
        # run, via nuclei's registration in nuclei_coverage_test.go.
        #
        # The existence assertion is the load-bearing half. The updater's
        # default layout is a version-dependent detail and the test helpers
        # hardcode these paths, so a tree that lands anywhere else must redden
        # this step rather than let both tests skip -- a skipped test is not a
        # passing test, and gate 14a counts it as a failure.
        shell: bash
        run: |
          set -euo pipefail
          tpl="$HOME/nuclei-templates"
          oidc="$HOME/nuclei-templates/http/technologies/oidc-detect.yaml"
          keycloak="$HOME/nuclei-templates/http/exposures/configs/keycloak-openid-config.yaml"
          if ! nuclei -update-templates -update-template-dir "$tpl"; then
            echo "::warning::the nuclei template updater exited non-zero -- the assertion below is what decides this step"
          fi
          if [ ! -f "$oidc" ] || [ ! -f "$keycloak" ]; then
            echo "::warning::the updater did not leave both OIDC templates under $tpl -- falling back to a shallow clone of the template tree"
            rm -rf "$tpl"
            git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates "$tpl"
          fi
          rc=0
          for f in "$oidc" "$keycloak"; do
            if [ -f "$f" ]; then
              echo "ok $f"
            else
              echo "::error::template not installed at $f -- the two nuclei coverage tests read this exact path and would skip"
              rc=1
            fi
          done
          exit "$rc"
      - name: Release-gates self-test (proves --require-all / --delegate can fail)
        # Same posture as the coverage-critical self-test: before the gates
        # judge, prove the mechanism that turns a SKIPPED gate into a red job
        # still works. Stub `go`, no tool tree, ~2 seconds.
        run: make release-gates-selftest
      - name: make release-gates-ci (--require-all; 11/13/14b delegated)
        id: gates
        env:
          # Caller-owned log directory: the script never removes it, so the
          # evidence steps below can read it on every outcome.
          RELEASE_GATES_LOGDIR: ${{ runner.temp }}/release-gates-logs
        run: make release-gates-ci

      # ── evidence ──────────────────────────────────────────────────────────
      # Two files, and ONLY two, leave the log directory: summary.txt (every
      # row with its verdict and note) and gate13_argvector.log (the census
      # that decided gate 13). The rest of the directory is other gates' tool
      # output and is not staged for a public artifact on a public repo.
      #
      # `if: always()` on both steps: a summary that is only uploaded on
      # failure cannot show a reader that a green run had every gate executed
      # or delegated, which is the whole claim this job now makes. The collect
      # step exits 0 by design — it is a reporter, so a job that died before
      # the gates ran keeps exactly one red step, the one that broke.
      - name: Collect release-gates evidence
        id: collect
        if: always()
        shell: bash
        env:
          RELEASE_GATES_LOGDIR: ${{ runner.temp }}/release-gates-logs
        run: |
          dest="${{ runner.temp }}/release-gates-evidence"
          mkdir -p "$dest"
          staged=0
          for f in summary.txt gate13_argvector.log; do
            if [ -f "$RELEASE_GATES_LOGDIR/$f" ]; then
              cp "$RELEASE_GATES_LOGDIR/$f" "$dest/$f"
              staged=$((staged + 1))
            fi
          done
          if [ "$staged" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "staged $staged evidence file(s):"
            ls -l "$dest"
            echo "::group::release-gates summary"
            cat "$dest/summary.txt" 2>/dev/null || echo "(no summary.txt)"
            echo "::endgroup::"
            exit 0
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No summary.txt or gate13_argvector.log under $RELEASE_GATES_LOGDIR:"
          echo "the gates step never ran (checkout, setup-go or an install step"
          echo "above is the one that broke). This step is a reporter, not a gate."
          exit 0
      - name: Upload release-gates evidence
        if: always() && steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-${{ matrix.ref || github.ref_name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-gates-evidence/
          if-no-files-found: error
          retention-days: 14

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    # XPLAT-05: build + the SMOKE RING on every supported platform on each
    # PR/push (Linux + macOS; Apple Silicon via macos-latest, Intel x86_64 via
    # macos-15-intel — macos-13 was retired 2025-12-04 and jobs targeting a
    # retired label queue forever. macos-15-intel is supported until Aug 2027).
    #
    # This job used to run the WHOLE suite under -race on all four platforms —
    # four extra copies of what `unit` and `integration` already run, on the
    # slowest runners. It now builds the binary and runs ONLY the tests that
    # exist under `-tags smoke` (the FOUND-04 SIGKILL atomicity and FOUND-09
    # kill-tree proofs, which are the platform-sensitive ones). The full -race
    # suite stays with the unit/integration jobs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build + binary size gate (XCUT-02)
        run: make binary-size
      - name: Smoke-tagged tests only (make test-smoke, count-guarded)
        # The smoke-only set is COMPUTED inside the target, not hardcoded: the
        # names listed under `-tags smoke` minus the names listed without it.
        # A hardcoded list would rot the first time a smoke test was added or
        # renamed, and `-run` on a rotted list exits 0 having run nothing.
        run: make test-smoke
