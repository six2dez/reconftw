name: ci

permissions:
  contents: read
  packages: write # ghcr.io push via GITHUB_TOKEN (DOCK-05)
  id-token: write

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*" # publish the image alongside the GoReleaser release (DOCK-05)
  schedule:
    - cron: 0 2 * * * # run at 2 AM UTC

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # arm64 emulation on amd64 runners (DOCK-03)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # DockerHub publish (backward compat). Requires DOCKERHUB_USERNAME +
      # DOCKERHUB_TOKEN repository secrets.
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo docker system prune -af || true
      # The Dockerfile bakes in a pre-built binary (COPY bin/reconftw), so build
      # it on the host first; the image then ships exactly this binary.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build reconftw binary
        run: make build
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Dual registry: Docker Hub (compat) + ghcr.io (DOCK-05).
          images: |
            six2dez/reconftw
            ghcr.io/six2dez/reconftw
          # Tagging strategy (DOCK-06): semver + major.minor + latest + git SHA.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: . # repo root — Dockerfile copies bin/reconftw + Docker/entrypoint.sh
          file: ./Docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GO_VERSION is intentionally NOT passed: the Dockerfile's ARG default
          # is the single source of truth and is kept in step with go.mod. This
          # job used to hardcode GO_VERSION=1.25.0, silently overriding the pin
          # and building the published image with a toolchain whose stdlib has
          # reachable vulnerabilities — the nightly image was the one artefact
          # NOT covered by the version bump.
          build-args: |
            DEBIAN_CODENAME=bookworm

      - name: Verify published manifest
        run: |
          # Pick the first pushed tag to inspect.
          first_tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          docker buildx imagetools inspect "$first_tag" > /tmp/reconftw-manifest.txt
          grep -q 'linux/amd64' /tmp/reconftw-manifest.txt
          grep -q 'linux/arm64' /tmp/reconftw-manifest.txt

      - name: Verify image health
        run: |
          first_tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          docker pull "$first_tag"
          docker run --rm "$first_tag" --help
          docker run --rm "$first_tag" health-check
