# ⚠ THIS FILE BELONGS TO THE v1 BASH INSTALLER (install.sh) ONLY.
#
# It is NOT the v2 manifest. The Go binary embeds a completely different file,
# internal/core/backend/tools.lock, in a different format (a per-tool TOML
# table with kind/description/default_args/timeout_seconds/critical) covering
# the full 100+ tool inventory. This one is a flat
# `<binary>=<go-module>@<version>` list of pins read by install.sh:528.
#
# The two are NOT copies and MUST NOT be synchronised — a code review already
# mistook them for duplicates and proposed generating one from the other, which
# would corrupt both. This file retires with install.sh at the v2 cutover.
#
# tools.lock — pinned Go tool versions for stability-critical tools.
# Format: <binary>=<go-module>@<version>
# - Comment lines start with '#'
# - Blank lines tolerated
# - Tools not listed here fall through to `go install <module>@latest` in install.sh
# - Update by running `go install <module>@latest` once and recording the resolved tag

nuclei=github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.8.0
httpx=github.com/projectdiscovery/httpx/cmd/httpx@v1.9.0
ffuf=github.com/ffuf/ffuf/v2@v2.1.0
puredns=github.com/d3mondev/puredns/v2@v2.1.1
subfinder=github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.14.0

# High-privilege tools pinned for supply-chain hygiene (WR-04).
# These run with broad network/filesystem access during active scans.
# Verify tags are current before each major release by running:
#   go install <module>@latest  (in a sandbox) and recording the resolved version.
dalfox=github.com/hahwul/dalfox/v2@v2.9.2
katana=github.com/projectdiscovery/katana/cmd/katana@v1.1.2
dnsx=github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1
naabu=github.com/projectdiscovery/naabu/v2/cmd/naabu@v2.3.3
interactsh-client=github.com/projectdiscovery/interactsh/cmd/interactsh-client@v1.2.2
tlsx=github.com/projectdiscovery/tlsx/cmd/tlsx@v1.1.7
