# ─────────────────────────────────────────────────────────────────────────────
# Phase 7 — OSINT E2E tools (OSINT-01..16 + folded-in functions, D-O10).
# No SHA-256 pins yet (Phase 11 scope, D-O canonical_refs). asnmap + favirecon
# already present above (Phase 4/5). dnsx already present (DNS records OSINT-01).
# All best_effort (ARCH-09); most → LocalBackend (no axiom module).
# ─────────────────────────────────────────────────────────────────────────────
[[tools]]
# 18-05 VERDICT 2 (RS-D): `git` is REGISTERED, and osint/github_repos.go's clone
# leg is routed onto backend.Runner rather than justified as a bypass.
#
# THE ARGUMENT FOR THE OTHER ANSWER, and why it lost. 18-03's manifest declared
# this file `non_recon_binary` on the true premise that git is not a tools.lock
# entry, with the rationale "the registry runs the recon inventory, not the
# version-control system". But this file already carries SEVEN kind="system"
# rows — whois, nmap, exiftool, sqlmap, massdns, testssl.sh, axiom-scan — every
# one a base system dependency rather than something reconFTW builds. That
# boundary is not one this codebase actually draws, so the premise held while the
# rationale did not.
#
# AND THIS USE OF git IS NOT INFRASTRUCTURE. It fetches UNTRUSTED THIRD-PARTY
# repositories, at URLs derived from enumerepo output, into a workspace tmp dir
# for secret scanning (T-13-06-04 / T-18-05-02). Its only mitigations are two
# hardening measures — `-c protocol.ext.allow=never` (kills the ext:: transport,
# an RCE vector) and GIT_TERMINAL_PROMPT=0 — and until now NO ARTEFACT OF A RUN
# could show they were applied. On the seam the flags appear in
# logs/tools.jsonl's argv and the env moves to ExecOptions.Env, which is the
# argv-free secret-safe path ARCH-02 requires.
#
# The installer's OWN git dispatch is untouched and remains a declared
# `installer_toolchain` bypass: installing tools and cloning a scan target are
# different operations at different trust boundaries, and only the second belongs
# on the recon seam.
#
# critical = false, DELIBERATELY. git is required to INSTALL the 15 clone tools,
# but a box whose tools are already installed runs a full scan without it — only
# the github_repos clone leg degrades, which is best-effort by design (D-O8).
# critical = true would make `reconftw health-check` exit 1 on such a box: a
# false alarm, and FOUND-08 exists to make that exit code mean something.
#
# timeout_seconds = 300 is githubReposCloneTimeout moved verbatim from
# github_repos.go, where the derivation already lives ("company repos can be
# large ... a hung/auth-prompting clone is still killed"). Pinned by
# TestGitCloneDeadlineMatchesItsFormerBound.
name            = "git"
kind            = "system"
description     = "Version control client — clones untrusted company repos for the OSINT secret scan (OSINT-05)"
default_args    = []
timeout_seconds = 300
critical        = false
version         = "latest"
input_flag      = ""

