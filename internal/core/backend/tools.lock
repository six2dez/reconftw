# reconFTW v2.0 — Tools Lock
# Phase 3 seed: 10 tools needed by Phase 4 (Subdomains E2E + Axiom Integration).
# Phase 11 (Installer + Cross-Platform + Docker) extends this to the full 70+ tool
# inventory with SHA-256 verification per INST-02..04.
#
# Format: per-tool table; required keys:
#   name              — exec.LookPath name
#   kind              — go | python | system | rust
#   go_module         — Go module path (Go tools only)
#   description       — one-line description for health-check / docs
#   default_args      — args prepended to every invocation (currently empty)
#   timeout_seconds   — per-invocation timeout; 0 = no hard timeout
#   critical          — bool; FOUND-08 + Blocker 5: critical tools cause
#                       `reconftw health-check` to exit 1 when absent
#
# Optional repo-clone coordinates (18-02 / RS-B) — for the tools install.sh
# clones under the tools root (paths.tools_dir, default $HOME/Tools) instead of
# putting a binary on PATH. exec.LookPath cannot see any of these; before 18-02
# they were reported "missing" while sitting on disk. PATH always wins; the
# clone branch is only consulted when LookPath fails.
#   clone_dir         — the clone's directory, RELATIVE to the tools root.
#                       DECLARED, NEVER DERIVED FROM `name`: cmseek lives in
#                       CMSeeK, and a name-derived guess resolves on macOS
#                       (case-insensitive) and fails on Linux.
#   clone_entry       — the executable or script, relative to clone_dir.
#   clone_interpreter — optional, relative to clone_dir. When set IT becomes the
#                       executable and clone_entry becomes the argv prefix
#                       (regulator: venv/bin/python3 + main.py). When empty,
#                       clone_entry is the executable (gato: venv/bin/gato).
#   clone_workdir     — optional bool, DEFAULT FALSE. Run the tool with its clone
#                       directory as cwd. Declare it ONLY for a tool that resolves
#                       its own data files relative to its clone root (nomore403
#                       and its payload wordlists). The default is off because the
#                       default workspace root is RELATIVE ("workspaces"), so
#                       modules pass cwd-relative argv paths; changing cwd would
#                       silently re-point them into the tools root.
# All three MUST be relative and free of upward traversal — the containment
# check in ToolRegistry.Discover works by joining under the tools root, so an
# absolute value would bypass it by never being joined (T-18-02-02). Pinned by
# TestEveryDeclaredCloneEntryIsRelative.
#
# Critical tier (7 tools). WHAT THE BIT MEANS, because it drives four separate
# behaviours: `install` ABORTS when a critical tool fails; the post-install
# HealthCheck and `reconftw health-check` EXIT NON-ZERO when one is absent; and
# `install --profile core` installs the critical tier AND NOTHING ELSE.
#
# The test for membership is therefore NOT "important tool" — it is: with this
# absent, does a default run still produce its headline artefact, or does it
# produce a CONVINCING EMPTY ONE? Everything outside the tier degrades to a
# visible [SKIP]; everything inside it fails the run silently.
#
# The list was originally seeded as "the smallest passive+probe+resolve trio
# needed for any meaningful Phase 4 run" — scoped to the subdomain milestone,
# never revisited once it started gating the installer. That left 101 of 104
# tools able to fail while `install` still exited 0.
#
#   subfinder — passive subdomain enumeration; the primary passive source
#   httpx     — HTTP probe + tech detection; the DAG ROOT of the whole web
#               module (web/httpx.go: DependsOn() == nil, everything else
#               depends on it directly or transitively)
#   dnsx      — DNS resolver toolkit
#   puredns   — the ONLY wildcard-filtering mass resolver and the ONLY
#               brute-force resolver (SubActiveTask). Without it the resolved
#               set is wildcard-polluted rather than absent, which is worse.
#   massdns   — puredns's resolver engine. v2 NEVER invokes it directly, so an
#               absent massdns is invisible to every code path except this
#               declaration; puredns then fails at run time.
#   nuclei    — the findings deliverable. Runs in `recon` too, not just `all`
#               (ModeRecon -> webStageGroups -> web.nuclei), so without it
#               findings.jsonl is empty in every mode that claims to scan.
#   gf        — fills inputs/gf/<class>.txt, the candidate source for cmdi,
#               xss, sqli, lfi, ssrf, redirect and ssti. A missing bucket makes
#               each of those return StatusSkipped (see vulns/cmdi.go), so an
#               absent gf silently empties SEVEN vuln classes at once.
#               NOTE: the gf BINARY is not sufficient — it ships no patterns.
#               installer/gf_patterns.go provisions ~/.gf and health-check
#               verifies it; `critical` here only covers binary resolution.
#
# Required-but-not-critical: missing-required → WARN in health-check.

schema_version = "1.0"
generated_by   = "phase-11-plan-01"
generated_at   = "2026-06-16"

[[tools]]
name            = "subfinder"
kind            = "go"
go_module       = "github.com/projectdiscovery/subfinder/v2/cmd/subfinder"
description     = "Passive multi-source subdomain enumeration"
default_args    = []
# 17-07 (CR-07): was 180 = THREE MINUTES, while v1 allows 180 MINUTES.
# DERIVATION: subfinder is the only tool in this manifest that carries its own
# time budget on the command line — `-max-time`, in MINUTES (subfinder v2.14.0
# `-max-time int  minutes to wait for enumeration results`). The task passes
# advanced.tools.subfinder.timeout_minutes into it, default 180
# (config/defaults.go:391, matching reconftw.cfg:384 SUBFINDER_ENUM_TIMEOUT=180).
# THE RELATIONSHIP THESE TWO VALUES MUST KEEP: this process deadline must be
# >= that budget. A process deadline SHORTER than the tool's own budget means
# the manifest silently wins and the configured budget is decoration — which is
# what 180 seconds did: it cut the primary passive source off at three minutes,
# and ExecEnv discards the stdout produced up to that point (see local.go), so
# the contribution was zero rather than partial. Measured on 2026-08-26:
# `subfinder -all -d example.com -silent` was still running at 210s having
# emitted 0 lines, so a 180s kill takes the whole result.
# 10800s (180 min) + 600s grace for subfinder's own shutdown and flush = 11400.
# TestSubfinderProcessDeadlineCoversItsOwnBudget asserts the RELATIONSHIP against
# config.Defaults(), so raising either value without the other fails there.
timeout_seconds = 11400
critical        = true
version         = "v2.14.0"
input_flag      = ""
[[tools]]
name            = "httpx"
kind            = "go"
go_module       = "github.com/projectdiscovery/httpx/cmd/httpx"
description     = "HTTP probe with tech detection"
default_args    = []
# 16-05 (P4): was 0 = no deadline at ANY layer. applyToolContract is the only
# place a tool acquires one, there is no per-task or run-level deadline, so an
# httpx that blocked blocked until the operator killed the process.
# DERIVATION: v1 has no process bound for httpx — HTTPX_TIMEOUT=10 is its
# PER-REQUEST flag, not a process cap. So this is reasoned, not inherited.
# The 2026-08-20 live run probed 20 hosts in 31s. Probing is host_count x
# per-request timeout / threads, so an hour is ~116x the observed run and far
# above any plausible legitimate probe. Peers in this manifest: ffuf 900,
# tlsx 300, dnsx 14400.
timeout_seconds = 3600
critical        = true
version         = "v1.9.0"
input_flag      = "-l"
