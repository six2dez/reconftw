# reconFTW v2.0 — Tools Lock
# Phase 3 seed: 10 tools needed by Phase 4 (Subdomains E2E + Axiom Integration).
# Phase 11 (Installer + Cross-Platform + Docker) extends this to the full 70+ tool
# inventory with SHA-256 verification per INST-02..04.
#
# Format: per-tool table; required keys:
#   name              — exec.LookPath name
#   kind              — go | python | system | rust
#   go_module         — Go module path (Go tools only)
#   description       — one-line description for health-check / docs
#   default_args      — args prepended to every invocation (currently empty)
#   timeout_seconds   — per-invocation timeout; 0 = no hard timeout
#   critical          — bool; FOUND-08 + Blocker 5: critical tools cause
#                       `reconftw health-check` to exit 1 when absent
#
# Critical tier (3 tools — the smallest passive+probe+resolve trio needed
# for any meaningful Phase 4 run):
#   subfinder — passive subdomain enumeration
#   httpx     — HTTP probe + tech detection
#   dnsx      — DNS resolver toolkit
#
# Required-but-not-critical (7 tools): missing-required → WARN in health-check.

