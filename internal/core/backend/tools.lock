description     = "Credential spraying (PAR-02 deep spray, service-fingerprint input)"
default_args    = []
# 18-04: was 0, WHICH MEANS NO BOUND — and that was safe only for as long as
# vulns/spray.go dispatched brutus itself and applied its own 30-minute
# context.WithTimeout (brutusTimeout, spray.go). 18-04 routed that dispatch onto
# backend.Runner, which makes applyToolContract the SOLE owner of the deadline.
# Leaving this at 0 would therefore have silently converted a bounded
# credential-spraying run into an unbounded one against a third-party host —
# the same "the manifest silently wins" class as 17-07's subfinder finding,
# pointing the other way (T-18-04-01).
# DERIVATION: 1800 = 30 * 60, the exact bound spray.go used to apply, no more and
# no less. Spraying is legitimately long-running (many hosts x many services x a
# credential list), which is why the value is generous; it is not a guess.
# spray.go keeps the constant as `brutusFormerTimeout` and
# TestBrutusDeadlineMatchesItsFormerBound asserts this row equals it, so setting
# this back to 0 is a failing diff rather than an invisible one.
# NOTE ON PARTIAL WORK: brutus writes its hits to the -o file as it goes, so a
# deadline that fires does NOT lose everything the way a stdout-buffered tool
# would (local.go's CR-07 note) — spray.go parses that file on the error path.
timeout_seconds = 1800
critical        = false
version         = "latest"
input_flag      = ""
