# 18-05: 300 -> 0, and 0 here means NO MANIFEST BOUND on purpose. It is the ONLY
# row in this file that should carry it for a reason other than "nobody decided".
#
# This tool is not a request/response dispatch. It is a LONG-LIVED out-of-band
# callback server whose lifetime IS the SSRF task's lifetime, and that lifetime is
# owned by cfg.Vulns.SSRF.TimeoutSeconds — a value an operator can raise. 18-05
# routed vulns/ssrf.go onto Runner.StreamOpts, which makes applyToolContract the
# sole owner of any manifest deadline; leaving 300 here would have SILENTLY killed
# the OOB session mid-task for every operator who raised the task timeout, and the
# symptom would have been "SSRF reports no OOB callbacks" with nothing failing.
#
# It is the brutus trap (18-04) pointing the other way: there, moving a dispatch
# would have REMOVED a bound the module was applying; here, moving it would have
# IMPOSED one the module never had. Both are "a deadline that lives in two places
# and is owned by neither".
#
# NOT UNBOUNDED IN PRACTICE: startInteractshClient derives its session context
# from the task ctx, so the task's own WithTimeout still tears the process group
# down (the DoD-2 guarantee, unchanged). Pinned by
# TestInteractshHasNoManifestDeadline.
