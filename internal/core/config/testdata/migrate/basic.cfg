# basic.cfg — hand-authored migrator golden fixture (Phase 14 plan 14-01).
# Exercises the D-02 three-way disposition end-to-end:
#   Case A (mapped):     bool, int, duration string, quoted CSV
#   Case B (superseded): an arithmetic auto-scale thread key + a $(cat) file-read key
#   Case C (unknown):    an invented key (loud warning + # UNKNOWN comment)
SUBDOMAINS_GENERAL=true                      # Case A bool
CTR_LIMIT=999999                             # Case A int
WAYMORE_TIMEOUT=30m                          # Case A duration → v2 string
NUCLEI_SEVERITY="info,low,medium,high,critical"  # Case A quoted CSV → v2 string
FFUF_THREADS=$((AVAILABLE_CORES * 10))       # Case B arithmetic auto-scale thread
TLS_PORTS=$(cat "${SCRIPTPATH}/config/tls_ports.txt" 2>/dev/null | tr -d '\n')  # Case B file-read
SOME_INVENTED_KEY=whatever                   # Case C unknown
