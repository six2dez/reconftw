[project]
name = "spike"
version = "0.1.0"
description = "reconFTW v2 Python spike PoC — throwaway code for language ADR"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.21,<0.22",
    "structlog>=25.0,<26.0",
]

[project.scripts]
spike = "spike.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: real-tool integration tests (slow)",
]
testpaths = ["tests"]
