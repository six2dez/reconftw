# lab/parity/v1-overlay.cfg — reconFTW v1 (bash) overlay TEMPLATE for the offline parity lab.
#
# run.sh renders it to out/v1-overlay.generated.cfg (replacing @LAB_DIR@) and
# passes it with `./reconftw.sh -f <file>`: it is sourced AFTER reconftw.cfg and
# secrets.cfg, so every assignment here wins over the defaults. Mirrors lab.toml:
# local stages on, network-only stages off, DNS pinned to the lab resolver.

# --- DNS: only the lab resolver, never refresh, force the wildcard-filtering engine
resolvers="@LAB_DIR@/resolvers.txt"
resolvers_trusted="@LAB_DIR@/resolvers.txt"
update_resolvers=false
generate_resolvers=false
DNS_RESOLVER=puredns
PUREDNS_PUBLIC_LIMIT=200
PUREDNS_TRUSTED_LIMIT=200
PUREDNS_WILDCARDTEST_LIMIT=10
PUREDNS_WILDCARDBATCH_LIMIT=1000
DNSX_THREADS=10
DNSX_RATE_LIMIT=50

# --- OSINT: all network
OSINT=false
GOOGLE_DORKS=false
GITHUB_REPOS=false
GITHUB_LEAKS=false
GITHUB_ACTIONS_AUDIT=false
METADATA=false
EMAILS=false
DOMAIN_INFO=false
IP_INFO=false
API_LEAKS=false
THIRD_PARTIES=false
SPOOF=false

# --- subdomains: keep the lab-exercisable stages, drop the network ones
SUBDOMAINS_GENERAL=true
SUBPASSIVE=false        # subfinder/github/gitlab — network; the seed replaces it
SUBCRT=false
SUBNOERROR=false
SUBANALYTICS=false
SUBBRUTE=false          # parity with v2 `recon` (no brute)
SUBSCRAPING=true
SUBPERMUTE=false
SUBIAPERMUTE=false
SUBREGEXPERMUTE=false
SUBTAKEOVER=false
SUB_RECURSIVE_PASSIVE=false
SUB_RECURSIVE_BRUTE=false
ZONETRANSFER=false      # v2 `recon` has no zone-transfer stage; set true with --mode all
S3BUCKETS=false
REVERSE_IP=false

# --- web
WEBPROBEFULL=true
WEBSCREENSHOT=false
VIRTUALHOSTS=false
FAVIRECON=false
PORTSCANNER=false
GEO_INFO=false
PORTSCAN_PASSIVE=false
PORTSCAN_ACTIVE=false
SERVICE_FINGERPRINT=false
CDN_IP=false
WAF_DETECTION=false
NUCLEICHECK=true
NUCLEI_SEVERITY="info,low,medium,high,critical"
URL_CHECK=true
URL_CHECK_PASSIVE=false # waymore/urlfinder — network
URL_CHECK_ACTIVE=true
URL_GF=true
URL_EXT=true
JSCHECKS=true
FUZZ=true
CMS_SCANNER=false
WORDLIST=false
ROBOTSWORDLIST=false
PASSWORD_DICT=false
PARAM_DISCOVERY=false
LLM_PROBE=false
KATANA_HEADLESS_PROFILE=off

# --- rate limits / timeouts: tiny, the lab is on loopback
HTTPX_RATELIMIT=20
NUCLEI_RATELIMIT=20
FFUF_RATELIMIT=20
HTTPX_THREADS=5
KATANA_THREADS=5
HTTPX_TIMEOUT=5

# --- integrations: off
NOTIFICATION=false
SOFT_NOTIFICATION=false
AI_REPORT=false
AXIOM=false
REMOVETMP=false         # keep .tmp so the seed and intermediates stay inspectable
