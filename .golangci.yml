# golangci-lint v2.12.2 config — RESEARCH.md §Stack Snapshot row "Lint: golangci-lint v2.12.2".
#
# Phase 3 scaffold; Phase 4-7 may extend with reusable custom rule packages
# flagging exported *Key/*Token/*Password/*Secret fields not typed as
# log.Secret (ADR §10.1 lines 2396-2400). A custom golangci-lint plugin for
# that rule is out of scope for Phase 3 — for now, code review + grep audit
# is the manual enforcement, per CONTEXT.md discretion.
#
# FOUND-10 RAW-SUBPROCESS BAN (Plan 04, REQUIREMENTS.md line 49):
# Raw exec.Command / exec.CommandContext / (*exec.Cmd).Run / (*exec.Cmd).Start
# outside internal/core/backend/local.go is forbidden. Enforced by an AST scan
# in internal/core/backend/lint/no_raw_subprocess_test.go which uses go/ast +
# golang.org/x/tools/go/packages to walk every package under ./internal/...
# Runs as part of `go test ./...` on every CI push.
# Validated against testdata/violating.go fixture to prove the scanner works
# (TestFOUND10_FixtureDetected). Replacement: app.Tools.Run() or app.Tools.Stream()
# (the canonical *backend.Runner shape per ADR §5.3).
# Upgrade path: a true golangci-lint v2 custom plugin lives at
# cmd/foundlint-no-raw-subprocess/ (created by a future Phase 4+ ticket if/when
# the test-based approach proves insufficient).

version: "2"

linters:
  default: standard
  enable:
    - errcheck     # check return-value errors not handled
    - govet        # standard go vet checks
    - staticcheck  # 200+ correctness checks (includes simple/style)
    - unused       # find unused code (dead-code detection)
  disable: []
  # NOTE: gofumpt is a FORMATTER in golangci-lint v2, not a linter. Listing it under
  # `linters.enable` makes the whole config fail to load ("gofumpt is a formatter"),
  # which took the entire lint step down. It is declared under `formatters` below.

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
  tests: true
